plugins {
    id "java"
    id 'io.qameta.allure' version '2.11.2'
    id 'io.freefair.lombok' version "8.6"
}

group = 'guru.qa'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

def allureVersion = "2.28.0",
    selenideVersion = "7.2.3",
    restAssuredVersion = "5.5.0"

allure {
    report {
        version.set(allureVersion)
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set(allureVersion)
            }
        }
    }
}

dependencies {
    testImplementation(
            "io.rest-assured:rest-assured:$restAssuredVersion",
            "io.rest-assured:json-schema-validator:$restAssuredVersion",
            "io.qameta.allure:allure-rest-assured:$allureVersion",
            "com.codeborne:selenide:$selenideVersion",
            "io.qameta.allure:allure-selenide:$allureVersion",
            "org.junit.jupiter:junit-jupiter:5.10.2",
            "com.github.javafaker:javafaker:1.0.2",
            group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.13.1',
            "com.codeborne:pdf-test:1.8.1",
            "com.codeborne:xls-test:1.4.3",
            'com.opencsv:opencsv:5.9',
            'com.fasterxml.jackson.core:jackson-core:2.13.1',
            'com.fasterxml.jackson.core:jackson-databind:2.10.0',
            'org.aeonbits.owner:owner:1.0.4'
    )
}

tasks.withType(Test) {
    systemProperties(System.getProperties())

    def testName = System.getProperty("testName")
    def tag = System.getProperty("type", "regression")
    useJUnitPlatform({
        if (testName) {
            include(testName)
        } else {
            includeTags(System.getProperty("type", "regression"))
        }
    })
}